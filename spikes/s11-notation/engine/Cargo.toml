[package]
name = "s11-notation"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway S11 spike: standard notation above TAB, SMuFL metrics, PDF routes. Never merged."

# Own workspace: excluded from the production workspace (root `exclude = ["spikes"]`).
[workspace]

[dependencies]
mc-theory = { path = "../../../crates/mc-theory" }
mc-score = { path = "../../../crates/mc-score", features = ["fixtures"] }
# Today's TAB-only engine, as the N5 baseline on the same machine and scores.
mc-notation = { path = "../../../crates/mc-notation" }
# Spike-only, all MIT OR Apache-2.0 (crates.io, 2026-11-11; README section 2).
serde_json = "1"
ttf-parser = "0.25"
pdf-writer = "0.12"
subsetter = "0.2"
svg2pdf = "0.13"
# Already a dev dependency of mc-musicxml (ADR-033): reads MuseScore's re-export.
roxmltree = "0.21"
# Flate for the vector route's content stream (MIT OR Zlib OR Apache-2.0; svg2pdf uses it too).
miniz_oxide = "0.8"

[profile.release]
debug = false
