[package]
name = "s2-audio"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone workspace: spike code never joins the production workspace.
[workspace]

[features]
# Experiment A: cpal's thread priority promotion (pulls audio_thread_priority, MPL-2.0).
realtime = ["cpal/realtime"]
# Experiment B: register the callback thread with Windows MMCSS directly (windows-sys, MIT OR Apache-2.0).
mmcss = ["dep:windows-sys"]

[dependencies]
cpal = "=0.18.2"
rustysynth = "=1.3.8"
rtrb = "=0.4.1"
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
debug = true
