[package]
name = "s5-format"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone workspace: spike code never joins the production workspace.
[workspace]

[dependencies]
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
