name: mc_ffi
description: "Native build plugin: compiles crates/mc-ffi with cargokit and bundles the library (ADR-005)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # Desktop first (ADR-004); Windows is the release target. Linux and macOS are
      # kept for the weekly cross-platform builds.
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
