# Root Cargo workspace.
# Production crates live in crates/ and are introduced per phase
# (docs/architecture/architecture-overview.md). Every crate must be declared in
# architecture/allowed-deps.toml (FF-01). Spikes are throwaway code with their own
# workspaces and are excluded here.
[workspace]
resolver = "3"
members = ["xtask", "crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
# No license field: the project license is undecided (Q-10, ADR-015).
publish = false

# Pinned versions for all third-party crates (S7 audited).
[workspace.dependencies]
mc-theory = { path = "crates/mc-theory" }
mc-score = { path = "crates/mc-score" }
mc-guitar = { path = "crates/mc-guitar" }
mc-notation = { path = "crates/mc-notation" }
mc-project = { path = "crates/mc-project" }
mc-app = { path = "crates/mc-app" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = { version = "=0.11.1", default-features = false }
schemars = "=1.2.3"
proptest = "=1.12.0"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
# mc-ffi only (FF-02 wrapper ban); version pinned with the codegen (ADR-005).
flutter_rust_bridge = "=2.13.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.bench]
debug = true
