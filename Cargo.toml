# Root Cargo workspace.
# Production crates live in crates/ and are introduced per phase
# (docs/architecture/architecture-overview.md). Every crate must be declared in
# architecture/allowed-deps.toml (FF-01). Spikes are throwaway code with their own
# workspaces and are excluded here.
[workspace]
resolver = "3"
members = ["xtask", "crates/*"]
# `spikes` are throwaway. `fuzz` is the cargo-fuzz crate (FF-15, ADR-023): it needs
# nightly and libfuzzer-sys, so it stays out of the production workspace and its
# dependency is not part of the FF-01 matrix or the cargo-deny scan.
exclude = ["spikes", "fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
# No license field: the project license is undecided (Q-10, ADR-015).
publish = false

# Pinned versions for all third-party crates (S7 audited).
[workspace.dependencies]
mc-theory = { path = "crates/mc-theory" }
mc-score = { path = "crates/mc-score" }
mc-guitar = { path = "crates/mc-guitar" }
mc-notation = { path = "crates/mc-notation" }
mc-playback = { path = "crates/mc-playback" }
mc-midi = { path = "crates/mc-midi" }
mc-audio = { path = "crates/mc-audio" }
mc-project = { path = "crates/mc-project" }
mc-app = { path = "crates/mc-app" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = { version = "=0.11.1", default-features = false }
schemars = "=1.2.3"
proptest = "=1.12.0"
# mc-audio only (FF-02 wrapper bans, ADR-007). Versions validated by spike S2.
# cpal without the `realtime` feature (MPL-2.0 audio_thread_priority is banned, ADR-015).
cpal = "=0.18.2"
rustysynth = "=1.3.8"
rtrb = "=0.4.1"
# Windows MMCSS thread promotion in mc-audio only (ADR-007, ADR-027): the two features
# the call needs, nothing else. MIT OR Apache-2.0.
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Threading"] }
# FF-16 callback tests (BSD-1-Clause, dev-dependency of mc-audio only).
assert_no_alloc = "=1.1.2"
# mc-dsp only (tuner pitch detection, ADR-029). MIT OR Apache-2.0. realfft re-exports
# rustfft; mc-dsp uses realfft for the MPM autocorrelation.
realfft = "=3.5.0"
rustfft = "=6.4.1"
# mc-midi only (FF-02 wrapper ban, ADR-023). Unlicense.
midly = { version = "=0.5.3", default-features = false, features = ["std"] }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
# mc-ffi only (FF-02 wrapper ban); version pinned with the codegen (ADR-005).
flutter_rust_bridge = "=2.13.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.bench]
debug = true
