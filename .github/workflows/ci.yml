# CI for the Rust workspace and governance checks.
# The authoritative list of active fitness functions is architecture/fitness-inventory.toml;
# FF-20 verifies that every active check is wired into this workflow or weekly.yml.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (FF-03 domain purity is enforced here via per-crate clippy.toml)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests (FF-11 round trip, FF-13 and FF-14 properties, FF-23 memory, FF-32 schema, xtask self-tests)
        run: cargo test --workspace --all-features --locked

      - name: Benchmarks compile (FF-21; timings are measured on the reference machine)
        run: cargo bench --workspace --no-run --locked

      - name: Fitness checks (FF-01, FF-03, FF-04, FF-07, FF-19, FF-20, FF-33)
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          $base = if ($env:PR_BASE) { $env:PR_BASE } else { $env:PUSH_BEFORE }
          if ($base) { cargo xtask fitness all --base $base } else { cargo xtask fitness all }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rule coverage report (FF-24, advisory)
        run: cargo xtask fitness rule-coverage

      - name: Coupling report (FF-25, advisory)
        run: cargo xtask fitness coupling

      - name: Module cycle report (FF-26, advisory)
        run: cargo xtask fitness module-cycles

      - name: Complexity report (FF-28, advisory; warnings do not fail the job)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -W clippy::cognitive_complexity -W clippy::too_many_lines

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Mermaid diagrams (FF-33)
        working-directory: tools/mermaid-check
        run: |
          npm ci --no-audit --no-fund
          node check.mjs ../../docs

  bridge:
    # FF-12 (generated bindings in sync, ADR-005) and the Dart contract tests of
    # packages/core_bridge against the fake and the real core.
    runs-on: windows-latest
    env:
      FLUTTER_VERSION: 3.47.2
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Flutter (pinned tag)
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version

      - name: Install pinned codegen and cargo-expand (ADR-005 amendment 4)
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          cargo install cargo-expand --version 1.0.127 --locked

      - name: Fetch Dart packages
        working-directory: packages/core_bridge
        run: flutter pub get

      - name: Generated bindings in sync (FF-12)
        working-directory: packages/core_bridge
        shell: pwsh
        run: |
          # --no-dart-format: Dart SDK versions differ between machines and CI, which
          # makes `dart format` output non-deterministic for the diff check. The
          # generator output without formatting is deterministic for a given Rust API.
          # To regenerate after changing the Rust API:
          #   flutter_rust_bridge_codegen generate --no-dart-format
          flutter_rust_bridge_codegen generate --no-dart-format
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ../../crates/mc-ffi/src ../../packages/core_bridge/lib/src/generated
          if ($LASTEXITCODE -ne 0) {
            Write-Error "FF-12: generated bindings differ; run 'flutter_rust_bridge_codegen generate --no-dart-format' and commit"
            exit 1
          }

      - name: Build the native library for the contract tests
        run: cargo build -p mc-ffi --locked

      - name: Dart analysis
        working-directory: packages/core_bridge
        run: dart analyze --fatal-infos

      - name: Contract tests (fake and real core)
        working-directory: packages/core_bridge
        run: flutter test

      - name: editor_feature analysis and tests
        working-directory: packages/editor_feature
        run: |
          flutter pub get
          dart analyze --fatal-infos
          flutter test

      - name: playback_feature analysis and tests (ADR-028)
        working-directory: packages/playback_feature
        run: |
          flutter pub get
          dart analyze --fatal-infos
          flutter test

      - name: tools_feature analysis and tests (ADR-029)
        working-directory: packages/tools_feature
        run: |
          flutter pub get
          dart analyze --fatal-infos
          flutter test

      - name: app analysis and tests (FF-05, FF-06, FF-08, FF-09 Dart, shell)
        working-directory: app
        run: |
          flutter pub get
          dart analyze --fatal-infos
          flutter test

      - name: Windows app build and M3 acceptance tests (real core)
        # Builds the desktop app (cargokit compiles crates/mc-ffi into the bundle) and
        # runs app/integration_test against it: two tracks, keyboard entry, undo/redo,
        # save, reopen, recovery. The edit latency benchmark (app/tool) is run on the
        # reference machine, not here: CI runner timings are not comparable.
        working-directory: app
        run: |
          flutter build windows --debug
          flutter test integration_test -d windows

  cargo-deny:
    # cargo-deny-action is a container action and needs a Linux runner.
    # Pinned image: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19; move deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny (FF-09 licenses, FF-10 advisories and sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  musicxml-schema:
    # ADR-033 E1: every MusicXML export validates against the MusicXML 4.0 XSD. The
    # schema is fetched at a pinned commit and checked by SHA-256, not stored here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libxml2-utils
      - name: Validate the exports (ADR-033 E1)
        run: bash tools/musicxml-schema/validate.sh
