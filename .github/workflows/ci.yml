# CI for the Rust workspace and governance checks.
# The authoritative list of active fitness functions is architecture/fitness-inventory.toml;
# FF-20 verifies that every active check is wired into this workflow.
# Later phases add jobs as their fitness functions activate (docs/architecture/fitness-functions.md).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (FF-03 domain purity is enforced here via per-crate clippy.toml)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests (workspace, including xtask self-tests and property tests)
        run: cargo test --workspace --all-features --locked

      - name: Fitness checks (FF-19 trailers, FF-20 inventory, FF-33 links)
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          $base = if ($env:PR_BASE) { $env:PR_BASE } else { $env:PUSH_BEFORE }
          if ($base) { cargo xtask fitness all --base $base } else { cargo xtask fitness all }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Mermaid diagrams (FF-33)
        working-directory: tools/mermaid-check
        run: |
          npm ci --no-audit --no-fund
          node check.mjs ../../docs

  cargo-deny:
    # cargo-deny-action is a container action and needs a Linux runner.
    # Pinned image: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19; move deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny (FF-09 licenses, FF-10 advisories and sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans
