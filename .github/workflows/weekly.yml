# Weekly governance and portability checks that are slow, noisy or need extra tools.
# Important and Advisory fitness functions: a failure here asks for review; it does not
# block merges (docs/architecture/fitness-functions.md).
name: weekly

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # One pinned nightly for the jobs that need it (public-api, fuzz). An unpinned nightly
  # changes the rustdoc JSON and the sanitizer runtime under the pinned tools from week
  # to week (cargo-public-api 0.52.0, cargo-fuzz 0.13.1). This one was checked on the
  # reference machine on 2026-11-11: all nine public-api snapshots equal, and both fuzz
  # targets run for 300 s without a crash. Move it forward on purpose, with a re-check.
  NIGHTLY: nightly-2026-10-31

jobs:
  public-api:
    # FF-22 (Important): public API of library crates against architecture/public-api/.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install ${{ env.NIGHTLY }} --profile minimal
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Diff against snapshots
        shell: pwsh
        run: |
          foreach ($c in 'mc-theory','mc-score','mc-guitar','mc-notation','mc-playback','mc-project','mc-app','mc-dsp','mc-pattern') {
            cargo "+$env:NIGHTLY" public-api -p $c --simplified | Out-File -Encoding utf8NoBOM "architecture/public-api/$c.txt"
            if ($LASTEXITCODE -ne 0) { Write-Error "cargo public-api failed for $c"; exit 1 }
          }
          # The full diff, so a failure can be read in the log.
          git diff --exit-code -- architecture/public-api

  coverage:
    # FF-27 (Advisory): line and function coverage report.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Coverage summary
        run: cargo llvm-cov --workspace --all-features --exclude xtask --summary-only

  freshness:
    # FF-30 (Advisory): pinned dependencies with newer releases.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo xtask fitness freshness

  fuzz:
    # FF-15 (Important, ADR-023, ADR-036): fuzz the MIDI and Guitar Pro importers for a
    # bounded time each. A crash is minimized and committed as a regression fixture or
    # test of the adapter (then part of FF-11).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install ${{ env.NIGHTLY }} --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked
      - name: Fuzz the MIDI importer
        working-directory: fuzz
        # A fixed budget so the scheduled run finishes; -max_total_time is seconds.
        run: cargo +${{ env.NIGHTLY }} fuzz run import_smf -- -max_total_time=300 -rss_limit_mb=4096
      - name: Fuzz the Guitar Pro importer
        # FF-15 for mc-guitarpro (ADR-036 G5). The corpus is seeded with copies of the
        # S10 fixtures, so libfuzzer never writes into the committed fixture folder.
        working-directory: fuzz
        run: |
          mkdir -p corpus/import_gp
          cp ../crates/mc-guitarpro/tests/fixtures/tuxguitar/*.gp? corpus/import_gp/
          cargo +${{ env.NIGHTLY }} fuzz run import_gp corpus/import_gp -- -max_total_time=300 -rss_limit_mb=4096

  portability:
    # ADR-004: macOS and Linux keep building and passing tests before their port phase.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: ALSA development files (Linux)
        # cpal (mc-audio, since Phase 4) needs libasound2-dev to build on Linux, and the
        # ubuntu-24.04 image does not have it; without it the job fails at build time.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo test --workspace --all-features --locked
      - run: cargo xtask fitness wasm
