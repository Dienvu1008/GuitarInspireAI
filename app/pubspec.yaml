publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  core_bridge:
    path: ../packages/core_bridge
  editor_feature:
    path: ../packages/editor_feature
  app_platform:
    path: ../packages/app_platform
  ui_kit:
    path: ../packages/ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
