# Allowed dependency matrix (FF-01; GR-01, GR-03, GR-04, GR-05).
# Mirrors docs/architecture/dependency-rules.md section 1 and the crate table in
# docs/architecture/architecture-overview.md. Changing it requires an ADR trailer (protected path).
#
# Per crate:
#   layer        domain | application | adapter
#   phase        roadmap phase that introduces the crate
#   internal     workspace crates this crate may depend on (normal, dev and build dependencies)
#   external     third-party crates allowed as normal or build dependencies
#   dev_external third-party crates allowed only as dev-dependencies (tests, benches)
# A workspace crate that is not listed here fails FF-01. Listed crates may not exist yet.

[mc-theory]
layer = "domain"
phase = 1
internal = []
external = []
dev_external = ["proptest"]

[mc-score]
layer = "domain"
phase = 1
internal = ["mc-theory"]
external = []
dev_external = ["proptest"]

[mc-project]
layer = "domain"
phase = 1
# mc-pattern added in Phase 6a-5 (matrix: project -> pattern; ADR-034 sections 1 and 8,
# the pattern library in format 1.2).
internal = ["mc-theory", "mc-score", "mc-pattern"]
external = ["serde", "serde_json", "zip", "sha2", "schemars"]
dev_external = ["proptest", "criterion"]

[mc-app]
layer = "application"
phase = 1
# mc-guitar added in Phase 2 (ADR-003 context map: Application -> Guitar; ADR-019).
# mc-notation added in Phase 3 (dependency-rules matrix: app -> notation; ADR-018).
# mc-playback added in Phase 4 (matrix: app -> playback; ADR-003; Phase 4 entry decision Q2).
# mc-pattern added in Phase 6a-3 (matrix: app -> pattern; ADR-034 section 1, ApplyPattern).
internal = ["mc-theory", "mc-score", "mc-project", "mc-guitar", "mc-notation", "mc-playback", "mc-pattern"]
external = []
dev_external = ["proptest", "criterion"]

[mc-cli]
layer = "adapter"
phase = 1
# mc-midi added in Phase 4 (ADR-023); mc-musicxml in Phase 6 (ADR-033); mc-guitarpro in
# Phase 6d (ADR-036); mc-pdf in Phase 6c-5b (ADR-041 section 12).
internal = ["mc-app", "mc-project", "mc-midi", "mc-musicxml", "mc-guitarpro", "mc-pdf"]
external = []
dev_external = []

# ---- Later phases (declared now so the matrix is complete; crates do not exist yet) ----

[mc-guitar]
layer = "domain"
phase = 2
internal = ["mc-theory"]
external = []
dev_external = ["proptest"]

[mc-notation]
layer = "domain"
phase = 3
internal = ["mc-theory", "mc-score"]
external = []
# ADR-041 section 8 (user, 2026-11-12 and 2026-11-16): the metrics-table generator and
# check (serde_json, skrifa), FF-35 (sha2), random scores for L2 and L9 (proptest).
# ADR-041 section 11 (user, 2026-11-26): the PG6 font probe (subsetter).
# Tests only; the crate itself keeps no external dependency.
dev_external = ["proptest", "serde_json", "sha2", "skrifa", "subsetter"]

[mc-ffi]
layer = "adapter"
phase = 3
# mc-midi added in Phase 4 (ADR-023); mc-musicxml in Phase 6 (ADR-033); mc-guitarpro in
# Phase 6d (ADR-036); mc-pdf in Phase 6c-5b (ADR-041 section 12).
internal = ["mc-app", "mc-audio", "mc-midi", "mc-musicxml", "mc-guitarpro", "mc-pdf"]
external = ["flutter_rust_bridge"]
dev_external = []

[mc-playback]
layer = "domain"
phase = 4
internal = ["mc-theory", "mc-score"]
external = []
dev_external = ["proptest"]

[mc-audio]
layer = "adapter"
phase = 4
internal = ["mc-theory", "mc-playback", "mc-dsp", "mc-app"]
external = ["cpal", "rustysynth", "rtrb", "windows-sys"]
# assert_no_alloc (BSD-1-Clause) for FF-16 callback tests (Q2).
dev_external = ["assert_no_alloc"]

[mc-midi]
layer = "adapter"
phase = 4
# SMF import and export (ADR-023). String assignment is called from mc-guitar.
internal = ["mc-theory", "mc-score", "mc-guitar", "mc-playback"]
external = ["midly"]
dev_external = ["proptest"]

[mc-musicxml]
layer = "adapter"
phase = 6
# MusicXML 4.0 export (ADR-033). Reads the score; spelling is mc-theory (GR-05).
internal = ["mc-theory", "mc-score"]
external = []
# roxmltree: test-only XML parsing of the exported files (MIT OR Apache-2.0, ADR-033).
dev_external = ["proptest", "roxmltree"]

[mc-guitarpro]
layer = "adapter"
phase = 6
# Guitar Pro GP3 to GP5 import and export (ADR-036). Own clean-room reader and writer,
# no external dependency.
internal = ["mc-theory", "mc-score"]
external = []
dev_external = ["proptest"]

[mc-pdf]
layer = "adapter"
phase = 6
# PDF export (ADR-041 decision 5 and section 12, user 2026-11-26). Paints the paginated
# layout of mc-notation; mc-score for the score type paginate takes. skrifa reads the
# bundled fonts' cmap and metrics; subsetter subsets them; pdf-writer writes the file;
# miniz_oxide compresses its streams. mc-theory for the tests' shared scores only.
# Only mc-ffi and mc-cli use this crate.
internal = ["mc-theory", "mc-score", "mc-notation"]
external = ["pdf-writer", "subsetter", "miniz_oxide", "skrifa"]
dev_external = []

[mc-dsp]
layer = "domain"
phase = 5
internal = []
external = ["realfft", "rustfft"]
# proptest for the sine-sweep accuracy property; assert_no_alloc for the frame-processing
# no-alloc test (ADR-029: precondition for the tuner thread to run mc-dsp off the input ring).
dev_external = ["proptest", "assert_no_alloc"]

[mc-pattern]
layer = "domain"
phase = 6
internal = ["mc-theory", "mc-score", "mc-guitar"]
external = []
dev_external = ["proptest"]
