# Fitness function inventory (FF-20). Source of truth for which checks exist.
# Every id in docs/architecture/fitness-functions.md must appear here with the same phase.
# status = "active" requires a registered implementation (see xtask/src/fitness/inventory.rs).
# Entries with phase <= current_phase must be active.
# Removing an entry or downgrading active -> planned requires an
# "Architecture-Change: ADR-NNN" trailer (FF-19 also protects this file).

[meta]
current_phase = 0

