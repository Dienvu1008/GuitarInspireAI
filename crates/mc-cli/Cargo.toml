[package]
name = "mc-cli"
version = "0.1.0"
description = "Command-line harness for the Music Core: create, edit by script, validate, inspect and round-trip projects."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mc-cli"
path = "src/main.rs"

[dependencies]
mc-app = { workspace = true, features = ["native-fs", "fixtures"] }
mc-project.workspace = true

[lints]
workspace = true
