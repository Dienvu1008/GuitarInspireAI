[package]
name = "mc-app"
version = "0.1.0"
description = "Application layer: document sessions, command dispatch, undo, events, ports, and the native file store adapter."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["native-fs"]
# File-system ProjectStore and RecoveryStore (atomic save, backup, autosave, crash recovery).
native-fs = []
# Re-exports the deterministic reference scores for the CLI and benchmarks.
fixtures = ["mc-score/fixtures"]

[dependencies]
mc-theory.workspace = true
mc-score.workspace = true
mc-project.workspace = true
mc-guitar.workspace = true

[dev-dependencies]
mc-score = { workspace = true, features = ["fixtures"] }
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "commands"
harness = false

[lints]
workspace = true
