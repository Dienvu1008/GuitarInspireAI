[package]
name = "mc-ffi"
version = "0.1.0"
description = "Interop adapter and composition root for the Flutter app: flutter_rust_bridge API, DTO mapping and event streams (ADR-005)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mc_ffi"
# cdylib/staticlib for the Flutter plugin (cargokit); rlib for Rust tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
mc-app.workspace = true
# mc-audio: the playback engine wrapped as EngineHandle (ADR-028). mc-midi: SMF import
# and export (ADR-023). mc-musicxml: MusicXML export (ADR-033). mc-guitarpro: Guitar
# Pro import and export (ADR-036). The edges are in architecture/allowed-deps.toml for
# mc-ffi.
mc-audio.workspace = true
mc-midi.workspace = true
mc-musicxml.workspace = true
mc-guitarpro.workspace = true
flutter_rust_bridge.workspace = true

# ADR-022: the workspace lints, restated, with one difference: unsafe_code is "deny"
# instead of "forbid", so that only the generated module may allow it. FF-34 checks
# that this table equals [workspace.lints] except for that one value, and that
# `allow(unsafe_code)` appears only on `mod frb_generated;` in src/lib.rs.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
