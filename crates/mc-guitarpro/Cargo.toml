[package]
name = "mc-guitarpro"
version = "0.1.0"
description = "Guitar Pro interchange adapter: GP3, GP4 and GP5 (5.00) import into a validated score with an import report, and export with an export report (ADR-012, ADR-036). Own clean-room implementation."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mc-theory.workspace = true
mc-score.workspace = true

[dev-dependencies]
mc-score = { workspace = true, features = ["fixtures"] }
proptest.workspace = true

[lints]
workspace = true
