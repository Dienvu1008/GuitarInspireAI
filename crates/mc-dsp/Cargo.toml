[package]
name = "mc-dsp"
version = "0.1.0"
description = "Deterministic DSP for the tuner and analysis: an allocation-free monophonic pitch detector (MPM) over preallocated buffers (ADR-029, GR-03). No I/O, no clocks; wasm-compatible (FF-04)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Real FFT for the MPM autocorrelation (MIT OR Apache-2.0, pure Rust, wasm-compatible).
realfft.workspace = true

[dev-dependencies]
proptest.workspace = true
assert_no_alloc.workspace = true

[lints]
workspace = true
