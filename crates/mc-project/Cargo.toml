[package]
name = "mc-project"
version = "0.1.0"
description = "Native project format: versioned DTOs, ZIP package on byte streams, version policy, integrity, unknown-content detection."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mc-theory.workspace = true
mc-score.workspace = true
# The pattern library in format 1.2 (ADR-034 section 8).
mc-pattern.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
sha2.workspace = true
schemars.workspace = true

[dev-dependencies]
mc-score = { workspace = true, features = ["fixtures"] }
mc-pattern = { workspace = true, features = ["fixtures"] }
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "format"
harness = false

[lints]
workspace = true
